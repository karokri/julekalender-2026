name: Deploy til GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Sjekk at fasiten kan låses opp med passordet
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: npm run check-doors
      - name: Krypter token med felles passord
        env:
          DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: node scripts/encrypt-token.mjs >> .env.production.local
      - run: npm run build
        env:
          VITE_DATA_REPO: ${{ vars.DATA_REPO || format('{0}-data', github.repository) }}
          VITE_ADMIN_CODE_HASH: ${{ secrets.VITE_ADMIN_CODE_HASH }}
          VITE_TITLE: ${{ vars.TITLE }}
          VITE_THEME: ${{ vars.THEME }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
